name: Prepare production config

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Copy production config
        run: cp assets/js/config.prod.js assets/js/config.js

      - name: Verify copied config
        run: cmp assets/js/config.prod.js assets/js/config.js
