name: Test and deploy Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out repository
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        id: setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies and run tests
        id: tests
        run: bash scripts/run-tests.sh

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Build Pages artifact
        if: github.event_name != 'pull_request'
        id: build_pages
        run: |
          mkdir -p _site
          cp index.html dashboard.html _site/
          cp -R assets _site/assets

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deploy
        uses: actions/deploy-pages@v4

      - name: Notify Discord
        if: always()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          COMMIT_SHA: ${{ github.sha }}
          CHECKOUT_RESULT: ${{ steps.checkout.outcome }}
          NODE_RESULT: ${{ steps.setup_node.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          PAGES_CONFIG_RESULT: ${{ steps.configure_pages.outcome }}
          PAGES_BUILD_RESULT: ${{ steps.build_pages.outcome }}
          PAGES_UPLOAD_RESULT: ${{ steps.upload_pages.outcome }}
          PAGES_DEPLOY_RESULT: ${{ steps.deploy.outcome }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::warning::Discord notification skipped; configure the DISCORD_WEBHOOK_URL Actions secret."
            echo "Discord notification skipped: add the repository Actions secret DISCORD_WEBHOOK_URL." \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          python3 - <<'PY' > discord-payload.json
          import json
          import os

          results = [
              ("Checkout", os.environ.get("CHECKOUT_RESULT", "unknown")),
              ("Node setup", os.environ.get("NODE_RESULT", "unknown")),
              ("Tests", os.environ.get("TEST_RESULT", "unknown")),
              ("Pages configuration", os.environ.get("PAGES_CONFIG_RESULT", "skipped")),
              ("Pages build", os.environ.get("PAGES_BUILD_RESULT", "skipped")),
              ("Pages artifact upload", os.environ.get("PAGES_UPLOAD_RESULT", "skipped")),
              ("Pages deployment", os.environ.get("PAGES_DEPLOY_RESULT", "skipped")),
          ]
          failed = any(result in ("failure", "cancelled") for _, result in results)
          outcome = "FAILED" if failed else "SUCCEEDED"
          description = f"**Repository:** {os.environ['REPOSITORY']}\n"
          description += "\n".join(f"**{name}:** {result}" for name, result in results)
          description += f"\n[Workflow run and logs]({os.environ['RUN_URL']})"

          payload = {
              "allowed_mentions": {"parse": []},
              "embeds": [{
                  "title": f"GitHub Actions {outcome} — run {os.environ['RUN_ID']}",
                  "url": os.environ["RUN_URL"],
                  "description": description,
                  "color": 0x2ECC71 if not failed else 0xE74C3C,
                  "footer": {
                      "text": f"Attempt {os.environ['RUN_ATTEMPT']} · commit {os.environ['COMMIT_SHA'][:7]}"
                  },
              }],
          }
          print(json.dumps(payload))
          PY

          curl --fail --silent --show-error --max-time 15 \
            --header "Content-Type: application/json" \
            --data-binary @discord-payload.json \
            "$DISCORD_WEBHOOK_URL"
